<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcel Vanilla App</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="l-header">
      <!-- Logo du site, affiché dans l'en-tête. -->
      <img src="img/logo-line.svg" class="header-logo" alt="logo" />

      <!-- Navigation partagée : en ligne sur grand écran, en sidebar sur mobile. -->
      <nav class="header-navigation" id="header-navigation">
        <a href="#">Menu</a>
        <a href="#">À propos</a>
        <a href="#">Horaires</a>
        <a href="#">Réservation</a>
        <a href="#">Commande</a>
      </nav>
      <!-- aria-label nomme l'action du bouton pour les lecteurs d'écran. -->
      <button
        class="header-burger"
        type="button"
        aria-label="Ouvrir le menu"
        aria-controls="header-navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <!-- aria-label explique aux lecteurs d'écran que ce bouton referme la sidebar. -->
      <button
        class="header-menu-backdrop"
        type="button"
        aria-label="Fermer le menu"
      ></button>

      <!-- Décoration placée sous l'en-tête. -->
      <img src="img/dentelle.svg" class="l-header-dentelle" alt="dentelle" />
    </header>

    <main>
      <!-- Hero section -->
      <div class="l-hero hero">
        <div class="hero-content">
          <img
            class="hero-img"
            src="img/hero.png"
            alt="image de fond d'un cupcake rose"
          />
          <img
            class="hero-logo"
            src="img/logo-3-lines.svg"
            alt="The Whimsy Bakery logo"
          />
          <a class="btn-reservation" href="#">Réserver une table</a>
        </div>
      </div>
    </main>
    <!-- Charge les interactions du bouton burger et de la sidebar. -->
    <script src="script.js" defer></script>
  </body>
</html>
