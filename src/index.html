<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcel Vanilla App</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="l-header">
      <img src="img/logo-line.svg" class="header-logo" alt="logo" />

      <nav class="header-navigation">
        <a href="#">Menu</a>
        <a href="#">À propos</a>
        <a href="#">Horaires</a>
        <a href="#">Réservation</a>
        <a href="#">Commande</a>
      </nav>
      <button class="header-burger" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <img src="img/dentelle.svg" class="l-header-dentelle" alt="dentelle" />
    </header>

    <main>
      <div class="l-hero">
        <div class="hero-content">
          <img
            class="hero-img"
            src="img/hero.png"
            alt="image de fond d'un cupcake rose"
          />
          <img
            class="hero-logo"
            src="img/logo-3-lines.svg"
            alt="The Whimsy Bakery logo"
          />
          <a class="hero-btn-reservation" href="#">Réserver une table</a>
        </div>
      </div>
    </main>
  </body>
</html>
